AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Wistia Video Analytics - End-to-End Data Engineering Pipeline
  (S3, Lambda, IAM, DynamoDB, Secrets Manager, EventBridge)

# ------------------------------------------------------------
# Parameters
# ------------------------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: wistia-pipeline

  DataLakeBucketName:
    Type: String
    Description: S3 bucket for raw and curated data

  LambdaCodeS3Key:
    Type: String
    Default: lambda/lambda.zip
    Description: S3 key for Lambda ZIP package

  WistiaSecretName:
    Type: String
    Default: wistia-api-token
    Description: Secrets Manager secret storing WISTIA_API_TOKEN

  ScheduleExpression:
    Type: String
    Default: rate(7 day)
    Description: EventBridge schedule for ingestion

# ------------------------------------------------------------
# Resources
# ------------------------------------------------------------
Resources:

  # ==========================
  # S3 Data Lake
  # ==========================
  DataLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${DataLakeBucketName}-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled

  # ==========================
  # DynamoDB Watermark Table
  # ==========================
  WatermarkTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub wistiadb
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: entity
          AttributeType: S
      KeySchema:
        - AttributeName: entity
          KeyType: HASH

  # ==========================
  # Secrets Manager
  # ==========================
  WistiaApiSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref WistiaSecretName
      Description: Wistia API token (DO NOT COMMIT)
      SecretString: '{"WISTIA_API_TOKEN":"0323ade64e13f79821bdc0f2a9410d9ec3873aa9df01f8a4a54d4e0f3dd2e6b4"}'

  # ==========================
  # IAM Role for Lambda
  # ==========================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-lambda-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: WistiaPipelinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # S3 Write
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${DataLakeBucketName}/*"

              # DynamoDB watermark
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt WatermarkTable.Arn

              # Secrets Manager
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref WistiaApiSecret

  # ==========================
  # Lambda Function
  # ==========================
  IngestWistiaLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-ingest"
      Runtime: python3.10
      Handler: ingest_wistia.lambda_handler
      Timeout: 120
      MemorySize: 512
      Role: !GetAtt LambdaExecutionRole.Arn

      Code:
        S3Bucket: !Ref DataLakeBucketName
        S3Key: lambda/lambda.zip

      Environment:
        Variables:
          S3_BUCKET: !Ref DataLakeBucketName
          RAW_PREFIX: data_raw
          CURATED_PREFIX: data_curated
          WATERMARK_TABLE: !Ref WatermarkTable
          WISTIA_SECRET_NAME: !Ref WistiaSecretName
          MEDIA_IDS: "gskhw4w4lm,v08dlrgr7v"

  # ==========================
  # EventBridge Schedule
  # ==========================

  IngestionSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-schedule"
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Id: LambdaTarget
          Arn: !GetAtt IngestWistiaLambda.Arn

  PermissionForEventBridge:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestWistiaLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IngestionSchedule.Arn

# ------------------------------------------------------------
# Outputs
# ------------------------------------------------------------
Outputs:
  BucketName:
    Value: !Ref DataLakeBucketName

  LambdaName:
    Value: !Ref IngestWistiaLambda

  WatermarkTableName:
    Value: !Ref WatermarkTable
