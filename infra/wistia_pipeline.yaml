AWSTemplateFormatVersion: "2010-09-09"
Description: Wistia Pipeline - Ingestion and Transformation Stack

Parameters:
  ProjectName:
    Type: String
    Default: wistia-pipeline

  WistiaSecretName:
    Type: String
    Default: WISTIA_API_TOKEN
    Description: Secrets Manager secret storing WISTIA_API_TOKEN

  RawPrefix:
    Type: String
    Default: data_raw/

  CuratedPrefix:
    Type: String
    Default: curated_data/

  GlueJobRunMode:
    Type: String
    Default: scheduled

Resources:

# --------------------------------------------------
# S3 Data Lake Bucket
# --------------------------------------------------
  DataLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub wistia-${AWS::AccountId}-${AWS::Region}

# --------------------------------------------------
# Secrets Manager
# --------------------------------------------------
  WistiaSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: wistia-api-secret
      Description: Wistia API token
      SecretString: '{"WISTIA_API_TOKEN":"0323ade64e13f79821bdc0f2a9410d9ec3873aa9df01f8a4a54d4e0f3dd2e6b4"}'

# --------------------------------------------------
# DynamoDB Watermark Table
# --------------------------------------------------
  WatermarkTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-watermark
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

# --------------------------------------------------
# IAM Role for Lambda
# --------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaDataAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${DataLakeBucket}
                  - !Sub arn:aws:s3:::${DataLakeBucket}/*
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt WatermarkTable.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref WistiaSecret
              - Effect: Allow
                Action:
                  - glue:StartJobRun
                  - glue:StartCrawler
                Resource: "*"

# --------------------------------------------------
# Lambda Function
# --------------------------------------------------
  IngestLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-ingest
      Runtime: python3.10
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      Code:
        S3Bucket: !Ref DataLakeBucket
        S3Key: lambda/ingest.zip
      Environment:
        Variables:
          s3_bucket: !Ref DataLakeBucket
          raw_prefix: !Ref RawPrefix
          curated_prefix: !Ref CuratedPrefix
          watermark_table: !Ref WatermarkTable
          wistia_secret_name: !Ref WistiaSecret
          media_ids: "gskhw4w4lm,v08dlrgr7v"
          glue_job_name: !Sub ${ProjectName}-transform

# --------------------------------------------------
# EventBridge Schedule (7 days)
# --------------------------------------------------
  IngestSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(7 days)
      Targets:
        - Arn: !GetAtt IngestLambda.Arn
          Id: IngestLambdaTarget

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IngestSchedule.Arn

# --------------------------------------------------
# IAM Role for Glue
# --------------------------------------------------
  GlueExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: GlueS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${DataLakeBucket}
                  - !Sub arn:aws:s3:::${DataLakeBucket}/*

# --------------------------------------------------
# Glue Database
# --------------------------------------------------
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub ${ProjectName}_analytics

# --------------------------------------------------
# Glue Job
# --------------------------------------------------
  GlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub ${ProjectName}-transform
      Role: !GetAtt GlueExecutionRole.Arn
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub s3://${DataLakeBucket}/jobs/transform.py
      DefaultArguments:
        --bucket: !Ref DataLakeBucket
        --raw_prefix: !Ref RawPrefix
        --curated_prefix: !Ref CuratedPrefix
        --run_mode: !Ref GlueJobRunMode
        --glue_job_name: !Sub ${ProjectName}-transform
      GlueVersion: "4.0"
      MaxRetries: 1
      Timeout: 10

# --------------------------------------------------
# Glue Crawler
# --------------------------------------------------
  GlueCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub ${ProjectName}-curated-crawler
      Role: !GetAtt GlueExecutionRole.Arn
      DatabaseName: !Ref GlueDatabase
      Targets:
        S3Targets:
          - Path: !Sub s3://${DataLakeBucket}/${CuratedPrefix}
